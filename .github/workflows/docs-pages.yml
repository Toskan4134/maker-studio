name: Deploy docs site to GitHub Pages

# Builds one Astro Starlight docs-site per version, then deploys them side by
# side with a version switcher in the header:
#   - latest (main of both repos) at the site root
#   - every `vX.Y.Z` app tag under `/vX.Y.Z/`
#   - every `vX.Y.Z` mods tag (one per Mod API version) under `/mods-vX.Y.Z/`
# The `mods-` prefix is not decoration: both repos tag `vX.Y.Z` on their own
# schedule and v1.0.0 exists in both, so the segments must not share a namespace.
#
# Doc sources are fetched from GitHub raw at each version's git ref:
#   - guides (EN + es): Toskan4134/maker-studio@<app ref>/docs/
#   - mods   (EN + es): Toskan4134/maker-studio-mods@<mods ref>/docs/
# `latest` uses `main` for both. An app version pins only the guides (its mod
# docs stay on `main` — the two version numbers are unrelated, so a same-name
# tag would be a coincidence, not a match); a mod-API version is the mirror
# image: guides from `main`, mod docs pinned to the tag.
#
# The version list is derived from the tags API at build time (no manifest file).

on:
  push:
    branches: [main]
    paths:
      - "docs/**" # user guides (latest version is built from raw main)
      - "docs-site/**" # site config, theme, components
      - ".github/workflows/docs-pages.yml"
  # Daily rebuild: picks up new version tags and changes in the separate
  # maker-studio-mods repo without a push here.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Cheap preflight so the daily cron doesn't redeploy an identical site.
  # Fingerprints everything the build consumes: the docs/ + docs-site/ trees
  # on this repo's main, the docs/ tree on the mods repo's main, and both
  # repos' tag lists. The build publishes the fingerprint as build-state.json
  # inside the deployed site; a scheduled run that computes the same value
  # skips the build. push / workflow_dispatch always build.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      fingerprint: ${{ steps.diff.outputs.fingerprint }}
    steps:
      - id: diff
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          AUTH=(-H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json")
          API=https://api.github.com/repos
          # Any curl failing just yields a partial fingerprint that won't match
          # the deployed one -> we build. Safe default.
          fp=$(
            {
              curl -fsSL "${AUTH[@]}" "$API/Toskan4134/maker-studio/git/trees/main" \
                | jq -r '.tree[] | select(.path == "docs" or .path == "docs-site") | "\(.path)=\(.sha)"' || true
              curl -fsSL "${AUTH[@]}" "$API/Toskan4134/maker-studio-mods/git/trees/main" \
                | jq -r '.tree[] | select(.path == "docs") | "mods-docs=\(.sha)"' || true
              curl -fsSL "${AUTH[@]}" "$API/Toskan4134/maker-studio/tags?per_page=100" \
                | jq -r '.[].name' || true
              curl -fsSL "${AUTH[@]}" "$API/Toskan4134/maker-studio-mods/tags?per_page=100" \
                | jq -r '.[].name' || true
            } | sort | sha256sum | cut -d' ' -f1
          )
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

          changed=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            deployed=$(curl -fsSL "https://makerstudio.toskan.es/build-state.json" \
              | jq -r '.fingerprint' 2>/dev/null || echo none)
            if [ "$fp" = "$deployed" ]; then
              echo "Nothing changed since the last deploy ($fp) — skipping scheduled rebuild."
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      # Custom domain (Cloudflare CNAME makerstudio -> toskan4134.github.io,
      # cname set in Settings -> Pages). Served at the domain root, so no
      # path prefix; the old github.io/maker-studio URLs 301 here.
      SITE_PREFIX: ""
      SITE_URL: https://makerstudio.toskan.es
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install deps
        working-directory: docs-site
        run: npm ci

      - name: Build every version
        working-directory: docs-site
        # GITHUB_TOKEN isn't auto-exposed to run: steps — map it explicitly, or
        # `set -u` aborts on the unbound var below (also raises the tags-API rate
        # limit over anonymous).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json")
          TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'

          # App version tags (newest first). Tolerant: an API hiccup just means
          # we build latest only this run.
          mapfile -t APP_TAGS < <(
            curl -fsSL "${AUTH[@]}" \
              "https://api.github.com/repos/Toskan4134/maker-studio/tags?per_page=100" \
              | jq -r '.[].name' | grep -E "$TAG_RE" | sort -rV || true
          )
          # Mods tags — one per Mod API version, each built as its own version.
          mapfile -t MODS_TAGS_ARR < <(
            curl -fsSL "${AUTH[@]}" \
              "https://api.github.com/repos/Toskan4134/maker-studio-mods/tags?per_page=100" \
              | jq -r '.[].name' | grep -E "$TAG_RE" | sort -rV || true
          )

          # Version lists consumed by VersionSelect / ModVersionSelect: [{id,label}].
          to_json() { jq -Rsc 'split("\n") | map(select(length>0))
                               | map({id:., label:(if .=="latest" then "Latest" else . end)})'; }
          VERSIONS_JSON="$(printf '%s\n' latest "${APP_TAGS[@]}" | to_json)"
          MODS_VERSIONS_JSON="$(printf '%s\n' latest "${MODS_TAGS_ARR[@]:-}" | to_json)"
          echo "Versions: latest ${APP_TAGS[*]:-}"
          echo "Mod API versions: latest ${MODS_TAGS_ARR[*]:-}"
          echo "DOCS_VERSIONS_JSON=$VERSIONS_JSON"
          echo "DOCS_MODS_VERSIONS_JSON=$MODS_VERSIONS_JSON"

          build_one() {
            # `npm run build` runs the custom docs loader, which inherits these
            # env vars to fetch this version's docs from GitHub (no port step).
            # The two *_VERSION vars are what each selector shows as current:
            # a mod-API build serves the guides from main, so its app version
            # stays `latest` while its mod version is the tag.
            local label="$1" app_ref="$2" mods_ref="$3" site_base="$4" out="$5"
            local docs_version="${6:-latest}" mods_version="${7:-latest}"
            echo "::group::Build $label (app@$app_ref mods@$mods_ref → $site_base)"
            DOCS_SOURCE=remote DOCS_VERSIONS_JSON="$VERSIONS_JSON" \
              DOCS_MODS_VERSIONS_JSON="$MODS_VERSIONS_JSON" \
              DOCS_VERSION="$docs_version" DOCS_MODS_VERSION="$mods_version" \
              DOCS_APP_REF="$app_ref" DOCS_MODS_REF="$mods_ref" \
              SITE_BASE="$site_base" OUT_DIR="$out" \
              npm run build
            echo "::endgroup::"
          }

          # latest (strict — a failure here must fail the deploy)
          build_one latest main main "$SITE_PREFIX" build-latest

          # tagged versions (best-effort — a broken old version is skipped, not fatal)
          for id in "${APP_TAGS[@]}"; do
            if build_one "$id" "$id" main "$SITE_PREFIX/$id" "build-$id" "$id" latest; then
              :
            else
              echo "::endgroup::"
              echo "::warning::Version $id build failed — skipping."
              rm -rf "build-$id"
            fi
          done

          # Mod API versions: guides from main, mod docs pinned to the mods tag.
          # Same best-effort rule as above.
          for id in "${MODS_TAGS_ARR[@]:-}"; do
            [ -n "$id" ] || continue
            if build_one "mods-$id" main "$id" "$SITE_PREFIX/mods-$id" "build-mods-$id" latest "$id"; then
              :
            else
              echo "::endgroup::"
              echo "::warning::Mod API version $id build failed — skipping."
              rm -rf "build-mods-$id"
            fi
          done

          # Merge: latest → dist root, app tags → dist/<id>/, mods tags → dist/mods-<id>/
          rm -rf dist
          mkdir -p dist
          cp -a build-latest/. dist/
          for id in "${APP_TAGS[@]}"; do
            [ -d "build-$id" ] || continue
            mkdir -p "dist/$id"
            cp -a "build-$id/." "dist/$id/"
          done
          for id in "${MODS_TAGS_ARR[@]:-}"; do
            [ -n "$id" ] && [ -d "build-mods-$id" ] || continue
            mkdir -p "dist/mods-$id"
            cp -a "build-mods-$id/." "dist/mods-$id/"
          done
          echo "Deployed versions: latest ${APP_TAGS[*]:-} | mod API ${MODS_TAGS_ARR[*]:-}"

      # Published at the site root so the check job can fetch it next run.
      - name: Write build state (scheduled-run skip check)
        working-directory: docs-site
        run: printf '{"fingerprint":"%s"}\n' "${{ needs.check.outputs.fingerprint }}" > dist/build-state.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
